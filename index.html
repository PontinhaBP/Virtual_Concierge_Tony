<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Tony - Hotel Marfil</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f4f8; padding: 20px; text-align: center; }
        .chat-box { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        header { background: #004a99; color: white; padding: 20px; border-radius: 15px 15px 0 0; margin: -20px -20px 20px -20px; }
        .message { background: #eef7ff; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; font-size: 0.95rem; min-height: 80px; }
        .btn { display: block; width: 100%; background: #004a99; color: white; border: none; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 0.9rem; box-sizing: border-box; }
        .book-btn { background: #c5a059; color: #fff; margin-top: 15px; }
        footer { font-size: 0.7rem; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="chat-box">
    <header>
        <h3>Tony - Virtual Concierge</h3>
        <p style="font-size: 0.8rem;">"Hosting Smiles Since 1970"</p>
    </header>

    <div id="chat-output" class="message">
        Hello! I'm Tony. Our family-run hotel has been welcoming visitors to San Antonio for over 50 years. How can I help you enjoy your stay?
    </div>

    <div id="action-area">
        <button class="btn" onclick="ask('breakfast')">When is breakfast?</button>
        <button class="btn" onclick="ask('pool')">Where is the pool?</button>
        <button class="btn" onclick="ask('gym')">Is there a gym?</button>
        <button class="btn" onclick="ask('boat')">Tell me about the boat!</button>
        <button class="btn" onclick="ask('sunset')">Best sunset spot?</button>
        <button class="btn" onclick="ask('guides')" style="background: #28a745;">Discover Our Digital Guides</button>
        <button class="btn" onclick="ask('sources')" style="background: #6c757d;">Access Local Sources</button>
    </div>
</div>

<script>
    function ask(topic) {
        let output = document.getElementById('chat-output');
        let actionArea = document.getElementById('action-area');
        
        if(topic === 'breakfast') {
            output.innerHTML = "<b>Tony:</b> On vacation, you set the schedule! Our buffet is served until <b>11:30 AM or 12:00 PM</b>.";
        } else if(topic === 'pool') {
            output.innerHTML = "<b>Tony:</b> For a swim, our guests enjoy full, <b>free access</b> to the swimming pool and sun loungers at our neighbor <b>Hostal Tarba</b>, just 100 meters away! (Please note: snacks and drinks at their pool bar are paid separately).";
        } else if(topic === 'gym') {
            output.innerHTML = "<b>Tony:</b> Yes! Our private <b>on-site gym/fitness center</b> is located right here inside <b>Hotel Marfil</b> for all our guests to use.";
        } else if(topic === 'sunset') {
            output.innerHTML = "<b>Tony:</b> Walk 10 mins to the Sunset Strip. <b>Pro Tip:</b> Buy a drink at a shop and sit on the promenade rocks—it's the best free seat in Ibiza!";
        } else if(topic === 'boat') {
            output.innerHTML = "<b>Tony:</b> Join us on the <b>Bon Oratge</b>, our private 12m yacht, for a sunset trip to Es Vedrà! How would you like to book?";
            actionArea.innerHTML = `
                <a href="mailto:info@hotelmarfil.com?subject=Yacht Booking Inquiry&body=Hi Tony, I would like to book a trip on the Bon Oratge..." class="btn book-btn">Email to Book Now</a>
                <a href="https://wa.me/34650220034?text=Hi Tony, I'm interested in the boat trip!" class="btn" style="background:#25D366" target="_blank">WhatsApp Tony</a>
                <button class="btn" onclick="location.reload()" style="background:#888">Back to Questions</button>
            `;
        } else if(topic === 'guides') {
            output.innerHTML = "<b>Tony:</b> I've prepared some special materials to help you find the authentic Ibiza. Which would you like?";
            actionArea.innerHTML = `
                <a href="Why_Hotel_Marfil_is_Ibiza_s_Hidden_Gem.mp4" class="btn" style="background: #e0a800; color: #333;" target="_blank">Watch Welcome Video</a>
                <a href="Hotel_Marfil_Guest_Distance_Guide%202.png" class="btn" style="background: #17a2b8;" target="_blank">View Location & Pool Map</a>
                <a href="Hotel_Marfil_Late_Breakfasts_and_Yacht_Sunsets.m4a" class="btn" style="background: #8e44ad;" target="_blank">Listen to Audio Guidebook</a>
                <a href="Marfil_Digital_Concierge.pdf" class="btn" style="background: #1180de;" target="_blank">Read Guest Guide (PDF)</a>
                <a href="The%20Digital%20Marfil%20Smile.pdf" class="btn" style="background: #1abc9c;" target="_blank">View Presentation Pitch</a>
                <button class="btn" onclick="location.reload()" style="background:#888">Back to Questions</button>
            `;
        } else if(topic === 'sources') {
            output.innerHTML = "<b>Tony:</b> Here are the real local sources and guides we used to build this assistant. Tap any link to explore:";
            actionArea.innerHTML = `
                <a href="Project%20Reference%20&%20Source%20Guide:%20Virtual%20Concierge%20Tony.docx" class="btn" style="background: #9b59b6;" target="_blank">Our Master Source Guide</a>
                <a href="https://www.hotelmarfil.com/en" class="btn" style="background: #28a745;" target="_blank">Hotel Marfil Official Site</a>
                <a href="https://www.ibiza-spotlight.com/magazine/2024/07/where-eat-and-around-san-antonio-town-ibiza-high-end-budget" class="btn" style="background: #17a2b8;" target="_blank">Ibiza Spotlight Eat Guide</a>
                <a href="https://www.nomadotravel.app/en/places/san-antonio" class="btn" style="background: #e0a800; color: #333;" target="_blank">Nomado Sunset Strip Guide</a>
                <a href="https://ibizahire.com/our-ibiza-guide-to-san-antonios-best-beaches/" class="btn" style="background: #fd7e14;" target="_blank">Ibiza Hire Beach Guide</a>
                <button class="btn" onclick="location.reload()" style="background:#888">Back to Questions</button>
            `;
        }
    }
</script>

<footer>
    Hotel Marfil, San Antonio, Ibiza
</footer>

</body>
</html>
