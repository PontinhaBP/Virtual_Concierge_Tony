<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Tony - Hotel Marfil</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f4f8; padding: 20px; text-align: center; }
        .chat-box { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        header { background: #004a99; color: white; padding: 20px; border-radius: 15px 15px 0 0; margin: -20px -20px 20px -20px; }
        .message { background: #eef7ff; padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left; font-size: 0.9rem; }
        .btn { display: block; width: 100%; background: #004a99; color: white; border: none; padding: 12px; margin: 5px 0; border-radius: 8px; cursor: pointer; font-weight: bold; }
        footer { font-size: 0.7rem; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="chat-box">
    <header>
        <h3>Tony - Virtual Concierge</h3>
        <p style="font-size: 0.8rem;">"Hosting Smiles Since 1970"</p>
    </header>

    <div id="chat-output" class="message">
        Hello! I'm Tony. I've been a host here in San Antonio since 1970. How can I help you today?
    </div>

    <button class="btn" onclick="ask('breakfast')">When is breakfast?</button>
    <button class="btn" onclick="ask('pool')">Where is the pool?</button>
    <button class="btn" onclick="ask('boat')">Tell me about the boat!</button>
    <button class="btn" onclick="ask('sunset')">Best sunset spot?</button>
</div>

<script>
    function ask(topic) {
        let output = document.getElementById('chat-output');
        if(topic === 'breakfast') {
            output.innerHTML = "<b>Tony:</b> On vacation, you set the schedule! Our buffet is served until <b>11:30 AM or 12:00 PM</b>.";
        } else if(topic === 'pool') {
            output.innerHTML = "<b>Tony:</b> We are a cozy city hotel, so we use the pool at our neighbor <b>Hostal Tarba</b>, just 100m away.";
        } else if(topic === 'boat') {
            output.innerHTML = "<b>Tony:</b> Join us on the <b>Bon Oratge</b>, our 12m private yacht, for a sunset trip to Es Vedrà!";
        } else if(topic === 'sunset') {
            output.innerHTML = "<b>Tony:</b> The Sunset Strip is 10 mins away. Buy a drink at a shop and sit on the <b>promenade rocks</b>—it's the local way!";
        }
    }
</script>

<footer>
    Hotel Marfil, San Antonio, Ibiza
</footer>

</body>
</html>
