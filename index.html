<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Tony - Hotel Marfil</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f4f8; padding: 20px; text-align: center; }
        .chat-box { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        header { background: #004a99; color: white; padding: 20px; border-radius: 15px 15px 0 0; margin: -20px -20px 20px -20px; }
        .message { background: #eef7ff; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; font-size: 0.95rem; min-height: 80px; }
        .btn { display: block; width: 100%; background: #004a99; color: white; border: none; padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 0.9rem; }
        .pool-highlight { color: #004a99; font-weight: bold; }
        footer { font-size: 0.7rem; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

<div class="chat-box">
    <header>
        <h3>Tony - Virtual Concierge</h3>
        <p style="font-size: 0.8rem;">"Hosting Smiles Since 1970"</p>
    </header>

    <div id="chat-output" class="message">
        Hello! I'm Tony. Since 1970, we've been helping guests discover the real Ibiza. How can I help you today?
    </div>

    <div id="action-area">
        <button class="btn" onclick="ask('breakfast')">When is breakfast?</button>
        <button class="btn" onclick="ask('pool')">Where is the pool?</button>
        <button class="btn" onclick="ask('boat')">Tell me about the boat!</button>
        <button class="btn" onclick="ask('sunset')">Best sunset spot?</button>
    </div>
</div>

<script>
    function ask(topic) {
        let output = document.getElementById('chat-output');
        if(topic === 'breakfast') {
            output.innerHTML = "<b>Tony:</b> On vacation, you set the schedule! Our buffet is served until <b>11:30 AM or 12:00 PM</b>.";
        } else if(topic === 'pool') {
            output.innerHTML = "<b>Tony:</b> We recommend the pool just 100m away. It is now part of the <b>azuline chain</b>. They offer a <span class='pool-highlight'>Day Pass for €15</span>, which you get back as credit to spend on drinks or food at their bar!";
        } else if(topic === 'boat') {
            output.innerHTML = "<b>Tony:</b> Join us on the <b>Bon Oratge</b>, our private 12m yacht, for a sunset trip to Es Vedrà! Email us at <b>info@hotelmarfil.com</b> to book.";
        } else if(topic === 'sunset') {
            output.innerHTML = "<b>Tony:</b> The Sunset Strip is 10 mins away. <b>Pro Tip:</b> Buy a drink at a shop and sit on the promenade rocks—it's the best free seat in Ibiza!";
        }
    }
</script>

<footer>
    Hotel Marfil, San Antonio, Ibiza
</footer>

</body>
</html>
